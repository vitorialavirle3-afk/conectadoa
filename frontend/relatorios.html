<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConectaDoa - Relatórios</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                ConectaDoa
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="menu"
            >

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="dashboard.html"
                        >
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="doadores.html"
                        >
                            Doadores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="doacoes.html"
                        >
                            Doações
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="relatorios.html"
                        >
                            Relatórios
                        </a>
                    </li>

                </ul>

                <button
                    class="btn btn-light btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>

    <main class="container mt-4">

        <div class="mb-4">

            <h2>
                Relatórios
            </h2>

            <p class="text-muted">
                Consulte o total de doações por categoria em determinado período.
            </p>

        </div>

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">
                    Período do relatório
                </h5>

                <div class="row g-3">

                    <div class="col-md-5">

                        <label
                            for="relatorioInicio"
                            class="form-label"
                        >
                            Data inicial
                        </label>

                        <input
                            type="date"
                            id="relatorioInicio"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-5">

                        <label
                            for="relatorioFim"
                            class="form-label"
                        >
                            Data final
                        </label>

                        <input
                            type="date"
                            id="relatorioFim"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-2 d-flex align-items-end">

                        <button
                            class="btn btn-primary w-100"
                            onclick="gerarRelatorio()"
                        >
                            Gerar
                        </button>

                    </div>

                </div>

                <div
                    id="mensagemRelatorio"
                    class="mt-3"
                ></div>

            </div>

        </div>

        <div
            id="resultadoRelatorio"
            style="display: none;"
        >

            <div class="row mb-4">

                <div class="col-md-6">

                    <div class="card">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Período
                            </h6>

                            <h5 id="periodoRelatorio">
                                -
                            </h5>

                        </div>

                    </div>

                </div>

                <div class="col-md-6">

                    <div class="card">

                        <div class="card-body">

                            <h6 class="text-muted">
                                Total de doações
                            </h6>

                            <h3 id="totalRelatorio">
                                0
                            </h3>

                        </div>

                    </div>

                </div>

            </div>

            <div class="card">

                <div class="card-body">

                    <h5 class="card-title mb-3">
                        Doações por categoria
                    </h5>

                    <div class="table-responsive">

                        <table
                            class="table table-hover"
                        >

                            <thead class="table-light">

                                <tr>

                                    <th>
                                        Categoria
                                    </th>

                                    <th>
                                        Quantidade
                                    </th>

                                </tr>

                            </thead>

                            <tbody id="tabelaRelatorio">

                                <tr>

                                    <td colspan="2">
                                        Nenhum dado.
                                    </td>

                                </tr>

                            </tbody>

                            <tfoot>

                                <tr>

                                    <th>
                                        Total
                                    </th>

                                    <th id="totalTabela">
                                        0
                                    </th>

                                </tr>

                            </tfoot>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="js/script.js"></script>

    <script>
        verificarLogin();
    </script>

</body>

</html>
