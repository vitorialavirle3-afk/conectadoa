<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConectaDoa - Doadores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                ConectaDoa
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="menu"
            >

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="dashboard.html"
                        >
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="doadores.html"
                        >
                            Doadores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="doacoes.html"
                        >
                            Doações
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="relatorios.html"
                        >
                            Relatórios
                        </a>
                    </li>

                </ul>

                <button
                    class="btn btn-light btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>

    <main class="container mt-4">

        <div
            class="d-flex justify-content-between align-items-center mb-4"
        >

            <div>

                <h2>
                    Doadores
                </h2>

                <p class="text-muted">
                    Cadastro e consulta de doadores.
                </p>

            </div>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalDoador"
            >
                + Novo Doador
            </button>

        </div>

        <div class="card mb-4">

            <div class="card-body">

                <div class="row">

                    <div class="col-md-8">

                        <label
                            for="pesquisa"
                            class="form-label"
                        >
                            Pesquisar doador
                        </label>

                        <input
                            type="text"
                            id="pesquisa"
                            class="form-control"
                            placeholder="Digite o nome ou CPF"
                        >

                    </div>

                    <div class="col-md-4 d-flex align-items-end">

                        <button
                            class="btn btn-outline-primary w-100"
                            onclick="pesquisarDoador()"
                        >
                            Pesquisar
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div class="card">

            <div class="card-body">

                <h5 class="card-title mb-3">
                    Doadores cadastrados
                </h5>

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle"
                    >

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Nome
                                </th>

                                <th>
                                    CPF
                                </th>

                                <th>
                                    E-mail
                                </th>

                                <th>
                                    Telefone
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Ações
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tabelaDoadores">

                            <tr>

                                <td
                                    colspan="6"
                                    class="text-center"
                                >
                                    Carregando doadores...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <div
        class="modal fade"
        id="modalDoador"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Novo Doador
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <form id="formDoador">

                        <div class="mb-3">

                            <label
                                for="nome"
                                class="form-label"
                            >
                                Nome *
                            </label>

                            <input
                                type="text"
                                id="nome"
                                class="form-control"
                                maxlength="150"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="cpf"
                                class="form-label"
                            >
                                CPF *
                            </label>

                            <input
                                type="text"
                                id="cpf"
                                class="form-control"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                E-mail *
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="telefone"
                                class="form-label"
                            >
                                Telefone
                            </label>

                            <input
                                type="tel"
                                id="telefone"
                                class="form-control"
                                placeholder="(00) 00000-0000"
                            >

                        </div>

                        <div id="mensagemDoador"></div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="salvarDoador()"
                    >
                        Cadastrar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="js/script.js"></script>

    <script>
        verificarLogin();
    </script>

</body>

</html>
