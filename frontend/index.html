<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConectaDoa - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="text-center mb-4">

                <h1>
                    ConectaDoa
                </h1>

                <p class="text-muted">
                    Sistema de Gestão de Doações
                </p>

            </div>

            <form id="loginForm">

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        E-mail
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="senha"
                        class="form-label"
                    >
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <div
                    id="mensagem"
                    class="mb-3"
                ></div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Entrar
                </button>

            </form>

            <div class="text-center mt-4">

                <small class="text-muted">
                    Associação ConectaDoa
                </small>

            </div>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
