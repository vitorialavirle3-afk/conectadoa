<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ConectaDoa - Doações</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a
                class="navbar-brand"
                href="dashboard.html"
            >
                ConectaDoa
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="menu"
            >

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="dashboard.html"
                        >
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="doadores.html"
                        >
                            Doadores
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="doacoes.html"
                        >
                            Doações
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="relatorios.html"
                        >
                            Relatórios
                        </a>
                    </li>

                </ul>

                <button
                    class="btn btn-light btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>

    <main class="container mt-4">

        <div
            class="d-flex justify-content-between align-items-center mb-4"
        >

            <div>

                <h2>
                    Doações
                </h2>

                <p class="text-muted">
                    Registro e consulta das doações recebidas.
                </p>

            </div>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalDoacao"
                onclick="prepararNovaDoacao()"
            >
                + Nova Doação
            </button>

        </div>

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">
                    Filtros
                </h5>

                <div class="row g-3">

                    <div class="col-md-4">

                        <label
                            for="dataInicio"
                            class="form-label"
                        >
                            Data inicial
                        </label>

                        <input
                            type="date"
                            id="dataInicio"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-4">

                        <label
                            for="dataFim"
                            class="form-label"
                        >
                            Data final
                        </label>

                        <input
                            type="date"
                            id="dataFim"
                            class="form-control"
                        >

                    </div>

                    <div class="col-md-4 d-flex align-items-end">

                        <button
                            class="btn btn-outline-primary w-100"
                            onclick="filtrarDoacoes()"
                        >
                            Filtrar
                        </button>

                    </div>

                </div>

                <div class="mt-3">

                    <button
                        class="btn btn-sm btn-outline-secondary"
                        onclick="limparFiltroDoacoes()"
                    >
                        Limpar filtros
                    </button>

                </div>

            </div>

        </div>

        <div class="card">

            <div class="card-body">

                <div
                    class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
                >

                    <h5 class="card-title mb-0">
                        Doações registradas
                    </h5>

                    <button
                        type="button"
                        class="btn btn-success"
                        onclick="exportarCSV()"
                    >
                        Exportar CSV
                    </button>

                </div>

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle"
                    >

                        <thead class="table-light">

                            <tr>

                                <th>
                                    Data
                                </th>

                                <th>
                                    Doador
                                </th>

                                <th>
                                    Categoria
                                </th>

                                <th>
                                    Quantidade
                                </th>

                                <th>
                                    Descrição
                                </th>

                                <th>
                                    Status
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tabelaDoacoes">

                            <tr>

                                <td
                                    colspan="6"
                                    class="text-center"
                                >
                                    Carregando doações...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <div
        class="modal fade"
        id="modalDoacao"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Registrar Nova Doação
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <form id="formDoacao">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="doador"
                                    class="form-label"
                                >
                                    Doador *
                                </label>

                                <select
                                    id="doador"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Carregando doadores...
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label
                                    for="dataDoacao"
                                    class="form-label"
                                >
                                    Data da doação *
                                </label>

                                <input
                                    type="date"
                                    id="dataDoacao"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="categoria"
                                    class="form-label"
                                >
                                    Categoria *
                                </label>

                                <select
                                    id="categoria"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Carregando categorias...
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label
                                    for="quantidade"
                                    class="form-label"
                                >
                                    Quantidade *
                                </label>

                                <input
                                    type="number"
                                    id="quantidade"
                                    class="form-control"
                                    min="1"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-3">

                            <label
                                for="descricao"
                                class="form-label"
                            >
                                Descrição
                            </label>

                            <textarea
                                id="descricao"
                                class="form-control"
                                rows="3"
                                placeholder="Descreva os itens da doação"
                            ></textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="status"
                                    class="form-label"
                                >
                                    Status *
                                </label>

                                <select
                                    id="status"
                                    class="form-select"
                                    required
                                >

                                    <option value="pendente">
                                        Pendente
                                    </option>

                                    <option value="entregue">
                                        Entregue
                                    </option>

                                    <option value="cancelada">
                                        Cancelada
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label
                                    for="dataEntrega"
                                    class="form-label"
                                >
                                    Data de entrega
                                </label>

                                <input
                                    type="date"
                                    id="dataEntrega"
                                    class="form-control"
                                >

                            </div>

                        </div>

                        <div id="mensagemDoacao"></div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="registrarDoacao()"
                    >
                        Registrar Doação
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="js/script.js"></script>

    <script>
        verificarLogin();
    </script>

</body>

</html>
